# PvPZoneCycle 1.3.8
# Build targets Java 17 bytecode. The Minecraft server itself still dictates its required Java version.
selection:
  tool: GOLDEN_AXE
  name: '&c&lArena Selector'
  lore: '&7Left-click: corner 1 | Right-click: corner 2'
  prevent-normal-use: true
  effects:
    enabled: true
    particle: END_ROD
cycle:
  default-on-seconds: 60
  default-off-seconds: 60
  start-on: true
  actionbar: true
  sounds: true
  on-sound: ENTITY_WITHER_SPAWN
  on-volume: 0.55
  on-pitch: 1.15
  off-sound: BLOCK_BEACON_DEACTIVATE
  off-volume: 0.75
  off-pitch: 1.0
messages:
  prefix: '&8[&bPvPZone&8] '
  protection-hint: '&eWant to protect this Arena from griefing?'
  protection-hint-command: '&7Enable block protection using:'
  protection-hint-usage: '&b/pvpzone protect <arenaName>'
  protection-hint-example: '&7Example: &f/pvpzone protect {arena}'

admin-reminder:
  enabled: true
  cooldown-seconds: 60
  message: '&eWelcome, Admin! Use /pvpzone wand to select an arena region. '
  click-label: '&a[CLICK TO GET WAND]'
