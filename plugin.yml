name: PvPZoneCycle
version: 1.3.8
main: com.gradercraft.pvpzonecycle.PvPZoneCycle
api-version: '1.20'
author: Grader Clients
description: Timed PvP arenas with smart anti-grief, explosion, and fire protection.
folia-supported: false
commands:
  pvpzone:
    description: Manage PvPZoneCycle arenas
    usage: /pvpzone help
permissions:
  pvpzone.admin:
    description: Manage PvP arenas and selection tool
    default: op
  pvpzone.protect:
    description: Enable block protection for an arena
    default: op
  pvpzone.test:
    description: Run the administrator permission test
    default: op
