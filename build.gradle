
plugins {
    id 'java'
}

group = 'com.gradercraft'
version = '1.3.8'

sourceSets {
    main {
        java {
            srcDirs = ['.']
            include 'PvPZoneCycle.java', 'PvPZoneRules.java'
        }
        resources {
            srcDirs = ['.']
            include 'plugin.yml', 'config.yml'
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def paperApi = project.findProperty('paperApi') ?: '1.20.1-R0.1-SNAPSHOT'

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApi}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def resolveJvm = (project.findProperty('resolveJvm') ?: '17') as Integer

configurations.configureEach {
    if (canBeResolved) {
        attributes {
            attribute(
                org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                resolveJvm
            )
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (!paperApi.startsWith('26')) {
        options.release = 17
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jar {
    archiveBaseName = 'PvPZoneCycle'
    archiveVersion = project.version
}

tasks.register('dumpCompileClasspath') {
    doLast {
        def f = file("${buildDir}/compile-classpath.txt")
        f.parentFile.mkdirs()
        f.text = configurations.compileClasspath.files.collect {
            it.absolutePath
        }.join(File.pathSeparator)

        println "Wrote compile classpath for paperApi=${paperApi} -> ${f}"
    }
}
